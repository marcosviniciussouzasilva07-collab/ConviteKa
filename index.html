<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite Especial 💕</title>

  <meta name="twitter:title" content="Convite Especial para Karina 💕" />
  <meta name="twitter:description" content="Um convite muito especial está esperando por você. ✨" />
  <meta name="twitter:image" content="https://marcosviniciussouzasilva07-collab.github.io/ConviteKa/src/img/convite007.jpeg" />

  <link rel="preload" as="image" href="./src/img/convite007.jpeg" />

  <style>
    :root {
      --color-bg-1: #2b0a25;
      --color-bg-2: #120014;
      --color-bg-3: #050006;
      --color-primary: #ff3b6b;
      --color-primary-dark: #b3001b;
      --color-text: #ffd9e3;
      --radius-lg: 18px;
      --radius-pill: 50px;
      --transition-fast: 0.2s ease;
      --transition-med: 0.4s ease;
      --transition-slow: 0.8s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at center, var(--color-bg-1) 0%, var(--color-bg-2) 70%, var(--color-bg-3) 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    #main {
      width: 100%;
      max-width: 600px;
      min-height: 80vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      min-width: 200px;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: #fff;
      text-align: center;
      white-space: nowrap;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 59, 107, 0.6);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast),
        opacity var(--transition-med), transform var(--transition-med);
    }

    #start-btn:hover {
      transform: translate(-50%, -50%) scale(1.07);
      box-shadow: 0 0 40px rgba(255, 59, 107, 0.9);
    }

    #start-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    #start-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    #start-btn.hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
    }

    #image-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      opacity: 0;
      transition: opacity var(--transition-slow);
    }

    #image-container.show {
      opacity: 1;
    }

    #convite-img {
      display: block;
      width: 100%;
      max-width: 500px;
      height: auto;
      border-radius: var(--radius-lg);
      box-shadow: 0 0 0 6px #fff, 0 0 40px rgba(255, 59, 107, 0.7), 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    #caption {
      margin-top: 16px;
      padding: 0 10px;
      color: var(--color-text);
      font-size: 1.2rem;
      font-style: italic;
      text-align: center;
      text-shadow: 0 0 12px rgba(255, 59, 107, 0.8);
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    .balloon {
      position: fixed;
      bottom: -150px;
      width: 60px;
      height: 80px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0.95;
      pointer-events: none;
      z-index: 5;
      box-shadow:
        inset -8px -8px 15px rgba(0, 0, 0, 0.25),
        inset 8px 8px 15px rgba(255, 255, 255, 0.25);
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: 50%;
      width: 2px;
      height: 40px;
      background: rgba(255, 255, 255, 0.5);
      transform: translateX(-50%);
    }

    @media (max-width: 480px) {
      #caption {
        font-size: 1rem;
      }
      .balloon {
        width: 40px;
        height: 55px;
      }
      .balloon::after {
        height: 30px;
        bottom: -30px;
      }
    }

    @media (max-width: 400px) {
      #start-btn {
        min-width: 160px;
        padding: 14px 28px;
        font-size: 0.95rem;
      }
    }

    /* Respeita usuários que preferem menos movimento */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div id="main">
    <button id="start-btn" type="button" aria-label="Abrir convite">🎉 Clique aqui 🎉</button>

    <div id="image-container">
      <img id="convite-img" src="./src/img/convite007.jpeg" alt="Convite Especial" width="600" height="600" />
      <p id="caption">Confirme sua presença! ✨💖</p>
    </div>
  </div>

  <audio id="bg-music" src="./src/audio/ai_ai_ai.mp3.mp3" preload="auto"></audio>

  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <script>
    (() => {
      'use strict';

      // ---------- Config ----------
      const COLORS = ['#ff3b6b', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#ffffff', '#b3001b'];
      const MAX_PARTICLES = 260;
      const SPAWN_DURATION_MS = 3500;
      const IMAGE_REVEAL_DELAY_MS = 900;
      const BALLOON_COUNT = 18;
      const BALLOON_STAGGER_MS = 90;

      // ---------- Elementos ----------
      const startBtn = document.getElementById('start-btn');
      const imageContainer = document.getElementById('image-container');
      const canvas = document.getElementById('fx-canvas');
      const bgMusic = document.getElementById('bg-music');
      const ctx = canvas.getContext('2d');

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ---------- Utils ----------
      const rand = (min, max) => Math.random() * (max - min) + min;
      const randItem = (arr) => arr[Math.floor(rand(0, arr.length))];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      // ---------- Sistema de partículas (confete) ----------
      const ParticleSystem = (() => {
        let particles = [];
        let spawning = false;
        let animationId = null;

        function create() {
          const isHeart = Math.random() < 0.35;
          return {
            x: rand(0, canvas.width),
            y: rand(-canvas.height, 0),
            size: isHeart ? rand(10, 20) : rand(6, 12),
            color: randItem(COLORS),
            speedX: rand(-1.5, 1.5),
            speedY: rand(2, 5),
            rotation: rand(0, 360),
            rotationSpeed: rand(-6, 6),
            isHeart,
            shape: Math.random() < 0.5 ? 'rect' : 'circle',
            life: 0,
            maxLife: rand(160, 260),
          };
        }

        function drawHeart(p) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          const s = p.size / 14;
          ctx.beginPath();
          ctx.moveTo(0, 4 * s);
          ctx.bezierCurveTo(0, 0, -8 * s, 0, -8 * s, 5 * s);
          ctx.bezierCurveTo(-8 * s, 9 * s, -4 * s, 11 * s, 0, 16 * s);
          ctx.bezierCurveTo(4 * s, 11 * s, 8 * s, 9 * s, 8 * s, 5 * s);
          ctx.bezierCurveTo(8 * s, 0, 0, 0, 0, 4 * s);
          ctx.fill();
          ctx.restore();
        }

        function drawShape(p) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          if (p.shape === 'rect') {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        function draw(p) {
          p.isHeart ? drawHeart(p) : drawShape(p);
        }

        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (spawning && particles.length < MAX_PARTICLES) {
            for (let i = 0; i < 4; i++) particles.push(create());
          }

          particles.forEach((p) => {
            p.x += p.speedX;
            p.y += p.speedY;
            p.rotation += p.rotationSpeed;
            p.life++;
            draw(p);
          });

          particles = particles.filter((p) => p.life < p.maxLife && p.y < canvas.height + 50);

          if (particles.length > 0 || spawning) {
            animationId = requestAnimationFrame(tick);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stop();
          }
        }

        function start() {
          spawning = true;
          if (!animationId) tick();
          setTimeout(() => {
            spawning = false;
          }, SPAWN_DURATION_MS);
        }

        function stop() {
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
        }

        return { start, stop };
      })();

      // ---------- Balões ----------
      function spawnBalloon() {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        balloon.style.background = `linear-gradient(135deg, ${randItem(COLORS)}, #ffffff33)`;
        balloon.style.left = `${rand(2, 92)}vw`;
        document.body.appendChild(balloon);

        const duration = rand(5, 8);
        const delay = rand(0, 0.6);
        const drift = rand(-40, 40);
        let start = null;

        function step(ts) {
          if (!start) start = ts;
          const elapsed = (ts - start) / 1000 - delay;
          if (elapsed < 0) {
            requestAnimationFrame(step);
            return;
          }
          const progress = elapsed / duration;
          if (progress >= 1.1) {
            balloon.remove();
            return;
          }
          const bottom = -150 + progress * (window.innerHeight + 250);
          const sway = Math.sin(progress * Math.PI * 4) * drift;
          balloon.style.bottom = `${bottom}px`;
          balloon.style.transform = `translateX(${sway}px) rotate(${sway / 4}deg)`;
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      function launchBalloons(count) {
        for (let i = 0; i < count; i++) {
          setTimeout(spawnBalloon, i * BALLOON_STAGGER_MS);
        }
      }

      // ---------- Evento principal ----------
      function handleStart() {
        bgMusic.play().catch((err) => console.warn('Áudio bloqueado pelo navegador:', err));

        startBtn.classList.add('hidden');
        startBtn.disabled = true;

        if (!prefersReducedMotion) {
          launchBalloons(BALLOON_COUNT);
          ParticleSystem.start();
        }

        setTimeout(() => {
          imageContainer.classList.add('show');
        }, IMAGE_REVEAL_DELAY_MS);
      }

      // ---------- Inicialização ----------
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      startBtn.addEventListener('click', handleStart, { once: true });
    })();
  </script>

</body>
</html>
